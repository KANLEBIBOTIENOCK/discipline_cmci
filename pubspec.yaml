name: discipline_cmci
description: "Application mobile de suivi des disciplines spirituelles CMCI avec export PDF et design floral féminin"
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
